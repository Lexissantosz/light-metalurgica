name: Aplicar textos LM-012 na release

on:
  push:
    branches:
      - release/rc-1
    paths:
      - "scripts/aplicar-textos-lm012.mjs"
      - ".github/workflows/aplicar-textos-lm012.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/rc-1

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Aplicar textos revisados
        run: node scripts/aplicar-textos-lm012.mjs

      - name: Commitar atualização quando necessária
        run: |
          if git diff --quiet -- data/produtos.json index.html; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/produtos.json index.html
          git commit -m "refactor(LM-012): aplica auditoria editorial da release"
          git push origin HEAD:release/rc-1
