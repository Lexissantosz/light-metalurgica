name: Release check

on:
  pull_request:
  workflow_dispatch:

jobs:
  validar-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verificar release
        run: node scripts/release-check.mjs
